     #drive-main-page > grid of: header role=banner #gb · New button · left
     nav[data-target=navTree] role=tree · .g3Fmkb column = .S630me header

     .a-ub-sc-oa > .a-ub-oa > 3× .l-Mg-qs-ra, first holding .a-szr7ld-ub whose only
     child the dump skipped — most likely an <iframe>) · right rail role=complementary
     aria-label="サイドパネル" · hidden viewer role=dialog aria-hidden=true holding a
     "文字起こしサイドバー" complementary. File items themselves were below the dump
     depth, so their inner structure is still our 0.2 guess. Test-only.
     Query: ?hl=ja|en &theme=dark|light &view=grid|list &crumbs=root|a/b &page=home &sugg=1
       &autodetails=1 (click opens pane) &nodetails=1 (pane never opens) &nomenudetails=1
       &dpnotabs=1 (legacy tab-less, label-less pane → side heuristic)
       &dpframe=same|inline|opaque|cross (pane body: same-origin iframe (default) / plain
         DOM / unreadable iframe / docs.google.com iframe served by the real-extension test)
       &dpkeep=1 (closing collapses the wrapper instead of removing the pane)
       &hdrfixed=1 (header block has a fixed height → toolbar must go before main)

  const select = (c, additive) => {

  document.addEventListener('dblclick', (e) => { const c = e.target.closest('[data-id]'); if (c) log('OPEN ' + nameOf(c)); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') return closeMenus();

  const M = ja ? {
    top: [['open', 'アプリで開く', 1], '-', ['dl', 'ダウンロード'], ['rn', '名前を変更', 0, 'Ctrl+Alt+E'], ['cp', 'コピーを作成', 0, 'Ctrl+C Ctrl+V'], '-',
      ['share', '共有', 1], ['org', '整理', 1], ['info', 'ファイル情報', 1], ['offline', 'オフラインで使用可能にする'], '-', ['trash', 'ゴミ箱に移動', 0, 'Delete']],
    share: [['sh', '共有', 0, 'Ctrl+Alt+A'], ['link', 'リンクをコピー']],
    org: [['mv', '移動', 0, 'Ctrl+Alt+M'], ['sc', 'ショートカットを追加'], ['star', 'スターを付ける', 0, 'Ctrl+Alt+S']],
    info: [['det', '詳細', 0, 'Ctrl+Alt+D'], ['act', 'アクティビティ']],

  } : {
    top: [['open', 'Open with', 1], '-', ['dl', 'Download'], ['rn', 'Rename', 0, 'Ctrl+Alt+E'], ['cp', 'Make a copy', 0, 'Ctrl+C Ctrl+V'], '-',
      ['share', 'Share', 1], ['org', 'Organize', 1], ['info', 'File information', 1], ['offline', 'Make available offline'], '-', ['trash', 'Move to trash', 0, 'Delete']],
    share: [['sh', 'Share', 0, 'Ctrl+Alt+A'], ['link', 'Copy link']],
    org: [['mv', 'Move', 0, 'Ctrl+Alt+M'], ['sc', 'Add shortcut'], ['star', 'Add to starred', 0, 'Ctrl+Alt+S']],

  let menus = [];

  function buildMenu(list, x, y, level) {
    const m = document.createElement('div'); m.className = 'Nmenu'; m.setAttribute('role', 'menu'); m.tabIndex = -1;

        m.querySelectorAll('.hl').forEach((h) => h.classList.remove('hl')); it.classList.add('hl');
        menus.slice(level + 1).forEach((s) => s.remove()); menus = menus.slice(0, level + 1);
        if (sub) { const r = it.getBoundingClientRect(); menus.push(buildMenu(M[id], r.right, r.top, level + 1)); }
      });
      it.addEventListener('click', () => { if (sub) return; log('MENU ' + label); closeMenus(); if (id === 'det' && !q.get('nomenudetails')) openDetails(); });
      m.appendChild(it);

    document.body.appendChild(m);

  }
  document.addEventListener('contextmenu', (e) => {

  document.addEventListener('click', (e) => { const b = e.target.closest('.Mr'); if (b) { const r = b.getBoundingClientRect(); closeMenus(); menus.push(buildMenu(M.top, r.left, r.bottom, 0)); } });
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.Nmenu')) closeMenus(); }, true);

  /* ---- details pane, real 2026 structure (see header comment) ---- */
  const DL = ja ? {
    title: '詳細', act: 'アクティビティ', close: '詳細を閉じる', view: '詳細を表示', hide: '詳細を非表示', who: 'アクセスできるユーザー', priv: '自分のみ',
    shared: (n) => n + ' 人と共有', manage: 'アクセスを管理', fd: 'ファイルの詳細', type: '種類', size: 'サイズ', storage: '使用容量', loc: '場所', owner: 'オーナー',

      (folder ? '' : kv(DL.size, SZ[i % SZ.length]) + kv(DL.storage, SZ[i % SZ.length])) +
      kv(DL.loc, `<div role="button" class="chip" tabindex="0">${folderSvg('#5f6368')}${DL.my}</div>`) +

  const FRAME_CSS = `body{margin:0;padding:0 24px;font:14px/1.4 Roboto,Arial,"Noto Sans JP",sans-serif;color:${document.body.classList.contains('dark') ? '#e3e3e3' : '#1f1f1f'}}` +
    '.dpS .h{font-weight:500;margin:14px 0 8px;font-size:15px}.acc{display:flex;align-items:center;gap:6px}.acc img{width:28px;height:28px;border-radius:50%}' +
    '.mbtn{display:inline-block;margin-top:8px;padding:6px 14px;border:1px solid #747775;border-radius:16px;font-size:13px}.kv{margin-bottom:12px}.kv .l{font-size:12px;color:#888;font-weight:500}' +
    '.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid #ccc;border-radius:8px}';
  // ?frame=details&i=..&k=..  → this document IS the pane body (cross-origin frame in the real-extension test)
  if (q.get('frame') === 'details') {
    document.body.innerHTML = '';

  const vd = document.getElementById('vdBtn');
  vd.setAttribute('aria-label', DL.view);
  const dpwrap = document.getElementById('dpwrap'), dphost = document.getElementById('dphost');
  const frameMode = q.get('dpframe') || 'same';
  let dp = null, open = false, fillTimer = 0;
  function build() {
    dp = document.createElement('div');
    dp.className = 'dp a-ub-j a-ub-j-hc Ub-Qs0SX a-ub-pb';
    dp.setAttribute('jsaction', 'xEXFB:h0Wcbf;');

      // legacy: no role, no label, no hooks → only the geometry heuristic can find it

        `<h2 class="a-Mg-lp" style="margin:0;font-size:16px;font-weight:400"><div role="button" tabindex="0" data-target="open" class="a-Mg-V-j dpT" style="display:flex;gap:10px;align-items:center"><span class="Ic">${folderSvg('#5f6368')}</span><span class="nm"></span></div></h2>` +

      `<div class="a-ub-sc-oa"><div class="a-ub-oa"><div class="l-Mg-qs-ra"><div class="a-szr7ld-ub" id="dpBodyHost"></div></div><div class="l-Mg-qs-ra"></div><div class="l-Mg-qs-ra"></div></div></div>` +
      `</div></div></div></div></div>`;
    dp.querySelector('[data-target=hideDetails] button').addEventListener('click', closeDetails);
    dp.querySelectorAll('[role=tab]').forEach((t) => t.addEventListener('click', () => { dp.querySelectorAll('[role=tab]').forEach((x) => x.setAttribute('aria-selected', String(x === t))); fillDetails(); }));
    const host = dp.querySelector('#dpBodyHost');
    if (frameMode === 'inline') { const d = document.createElement('div'); d.className = 'inl dpB'; host.appendChild(d); }
    else {
      const f = document.createElement('iframe');
      f.title = ''; f.setAttribute('frameborder', '0');
      if (frameMode === 'opaque') f.setAttribute('sandbox', '');
      host.appendChild(f);
      if (frameMode === 'same') f.srcdoc = `<!doctype html><html><head><style>${FRAME_CSS}</style></head><body></body></html>`;
      if (frameMode === 'opaque') f.srcdoc = '<!doctype html><body></body>';
    }
  }
  const selItem = () => items().find((x) => x.getAttribute('aria-selected') === 'true');
  function fillDetails() {
    if (!dp || !open) return;
    const c = selItem();
    const nm = c ? c.dataset.mName : DL.my;
    const kind = c ? c.dataset.mKind : 'folder';
    const typeL = kind === 'folder' ? DL.folderType : DL.types[kind];
    const hdr = dp.querySelector('#dpHdr');
    if (hdr) hdr.setAttribute('aria-label', nm + ' ' + typeL);
    (dp.querySelector('.dpT .nm') || dp.querySelector('.dpT')).textContent = nm;
    const actTab = dp.querySelector('[role=tab][aria-selected=true]');
    const activity = actTab && actTab !== dp.querySelector('[role=tab]');
    const html = !c ? '' : activity ? `<div class="dpS"><div class="h">${DL.act}</div><div>…</div></div>` : bodyHtml(+c.dataset.mI, kind);
    const f = dp.querySelector('iframe');
    const setBody = (h) => {
      if (!f) { const b = dp.querySelector('.dpB'); if (b) b.innerHTML = h; return; }
      if (frameMode === 'same') { const d = f.contentDocument; if (d && d.body) d.body.innerHTML = h; }
      else if (frameMode === 'cross') f.src = q.get('crossbase') + '?' + new URLSearchParams({ frame: 'details', hl: ja ? 'ja' : 'en', theme: q.get('theme') || '', i: c ? c.dataset.mI : '', k: c && !activity ? kind : '' });
      // opaque: nothing readable from outside
    };
    clearTimeout(fillTimer);
    setBody('<div class="ld">…</div>');
    if (c) fillTimer = setTimeout(() => setBody(html), 350);
  }
  function openDetails() {
    if (q.get('nodetails')) return;
    if (open) { fillDetails(); return; }
    if (!dp) build();
    if (!dp.isConnected) dphost.appendChild(dp);
    dpwrap.classList.remove('closed');
    open = true;
    vd.setAttribute('aria-label', DL.hide);
    log('DETAILS-OPEN');
    if (frameMode === 'same' && dp.querySelector('iframe') && !(dp.querySelector('iframe').contentDocument || {}).body) setTimeout(fillDetails, 30);
    fillDetails();
  }
  function closeDetails() {
    if (!open) return;
    open = false;
    if (q.get('dpkeep')) dpwrap.classList.add('closed');
    else { dp.remove(); dp = null; dpwrap.classList.add('closed'); }
    vd.setAttribute('aria-label', DL.view); log('DETAILS-CLOSE');
  }
  window.__details = { open: openDetails, close: closeDetails, isOpen: () => open };
  vd.addEventListener('click', () => (open ? closeDetails() : openDetails()));
  // Drive's shortcut: Alt+→ toggles the details pane
  document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'ArrowRight') { log('KEY-ALT-RIGHT'); open ? closeDetails() : openDetails(); } });
  // Drive-like: pane follows the selection; with ?autodetails=1 a click opens it
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-id]')) return;

  // selection changes by keyboard / synthetic selection also refresh the pane
  new MutationObserver(() => { if (open) { const c = selItem(); const key = c ? c.dataset.id : ''; if (key !== window.__dpKey) { window.__dpKey = key; fillDetails(); } } })
    .observe(document.getElementById('grid'), { attributes: true, subtree: true, attributeFilter: ['aria-selected'] });
})();
